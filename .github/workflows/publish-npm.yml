name: Publish npm packages

# Publishes every public workspace package whose version is not yet on the
# registry, authenticating via npm trusted publishing (OIDC) — no NPM_TOKEN
# secret to rotate. Each public package lists this repo + this workflow file
# as a trusted publisher on npmjs.com; id-token: write lets npm >= 11.5.1
# exchange the Actions OIDC token for publish credentials. Safe to re-run:
# scripts/ci-publish.mjs skips versions already on the registry.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Publish packages not yet on the registry
        run: node scripts/ci-publish.mjs
